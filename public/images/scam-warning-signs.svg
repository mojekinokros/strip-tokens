<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Warning illustration with a shield, phishing hook symbol, and blocked fake login page">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1440"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="wshield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="560" rx="24" fill="url(#wbg)"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <!-- fake login window blocked -->
    <rect x="60" y="90" width="300" height="230" rx="16" fill="#111833" stroke="#2a3568" stroke-width="2"/>
    <circle cx="92" cy="120" r="7" fill="#fb7185"/>
    <circle cx="114" cy="120" r="7" fill="#fbbf24"/>
    <circle cx="136" cy="120" r="7" fill="#34d399"/>
    <rect x="84" y="150" width="252" height="26" rx="8" fill="#202a55"/>
    <rect x="84" y="188" width="252" height="26" rx="8" fill="#202a55"/>
    <rect x="84" y="228" width="140" height="30" rx="10" fill="#fb7185" opacity="0.85"/>
    <text x="154" y="250" font-size="17" font-weight="700" fill="#2b060d" text-anchor="middle">Sign in</text>
    <circle cx="330" cy="290" r="42" fill="#2b0a12" stroke="#fb7185" stroke-width="5"/>
    <line x1="312" y1="272" x2="348" y2="308" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/>
    <line x1="348" y1="272" x2="312" y2="308" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/>
    <!-- phishing message bubble -->
    <rect x="420" y="90" width="280" height="170" rx="16" fill="#111833" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="464" cy="140" r="24" fill="#fbbf24"/>
    <text x="464" y="150" font-size="28" font-weight="800" fill="#2b1a02" text-anchor="middle">!</text>
    <rect x="500" y="122" width="170" height="14" rx="7" fill="#2a3568"/>
    <rect x="500" y="146" width="130" height="14" rx="7" fill="#202a55"/>
    <rect x="444" y="186" width="232" height="14" rx="7" fill="#202a55"/>
    <rect x="444" y="210" width="180" height="14" rx="7" fill="#202a55"/>
    <path d="M470 260 L450 292 L494 260 Z" fill="#111833" stroke="#fbbf24" stroke-width="2"/>
    <!-- shield protector -->
    <path d="M560 330 L668 366 V446 C668 510 618 548 560 570 C502 548 452 510 452 446 V366 Z" fill="#0c1226" stroke="url(#wshield)" stroke-width="8"/>
    <path d="M522 448 L552 478 L602 414" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- warning triangle -->
    <path d="M150 360 L230 496 H70 Z" fill="#2b1a02" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round"/>
    <text x="150" y="452" font-size="52" font-weight="800" fill="#fbbf24" text-anchor="middle">!</text>
    <text x="270" y="452" font-size="24" font-weight="700" fill="#ffffff">Stop.</text>
    <text x="270" y="486" font-size="24" font-weight="700" fill="#ffffff">Verify first.</text>
  </g>
</svg>
