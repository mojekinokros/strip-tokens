<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Step diagram showing account check, payment review, confirmation, and receipt saving">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16204a"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="snum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#0ea5c4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="560" rx="24" fill="url(#sbg)"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <line x1="110" y1="80" x2="110" y2="490" stroke="#2a3568" stroke-width="6" stroke-linecap="round"/>
    <!-- step 1 -->
    <circle cx="110" cy="100" r="34" fill="url(#snum)"/>
    <text x="110" y="113" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <rect x="170" y="55" width="520" height="90" rx="16" fill="#111833" stroke="#2a3568" stroke-width="2"/>
    <text x="200" y="92" font-size="24" font-weight="700" fill="#ffffff">Verify account</text>
    <text x="200" y="122" font-size="18" fill="#9aa3c7">Your own login, navigated to directly</text>
    <!-- step 2 -->
    <circle cx="110" cy="230" r="34" fill="url(#snum)"/>
    <text x="110" y="243" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <rect x="170" y="185" width="520" height="90" rx="16" fill="#111833" stroke="#2a3568" stroke-width="2"/>
    <text x="200" y="222" font-size="24" font-weight="700" fill="#ffffff">Review payment</text>
    <text x="200" y="252" font-size="18" fill="#9aa3c7">Amount, currency, fees, method</text>
    <!-- step 3 -->
    <circle cx="110" cy="360" r="34" fill="url(#snum)"/>
    <text x="110" y="373" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <rect x="170" y="315" width="520" height="90" rx="16" fill="#111833" stroke="#2a3568" stroke-width="2"/>
    <text x="200" y="352" font-size="24" font-weight="700" fill="#ffffff">Confirm in official flow</text>
    <text x="200" y="382" font-size="18" fill="#9aa3c7">Never through chats or strangers</text>
    <!-- step 4 -->
    <circle cx="110" cy="490" r="34" fill="#34d399"/>
    <text x="110" y="502" font-size="28" font-weight="800" fill="#04261b" text-anchor="middle">✓</text>
    <rect x="170" y="445" width="520" height="90" rx="16" fill="#111833" stroke="#34d399" stroke-width="2"/>
    <text x="200" y="482" font-size="24" font-weight="700" fill="#ffffff">Save receipt</text>
    <text x="200" y="512" font-size="18" fill="#9aa3c7">Reference number + screenshot</text>
  </g>
</svg>
