<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="Illustration of a checklist, receipt, and support chat bubble for payment troubleshooting">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10203f"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="520" rx="24" fill="url(#pbg)"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <!-- receipt -->
    <path d="M90 70 H320 V420 L296 402 L272 420 L248 402 L224 420 L200 402 L176 420 L152 402 L128 420 L104 402 L90 414 Z" fill="#f2f5ff"/>
    <rect x="120" y="110" width="170" height="16" rx="8" fill="#9aa3c7"/>
    <rect x="120" y="146" width="210" height="12" rx="6" fill="#c2c9e4"/>
    <rect x="120" y="170" width="210" height="12" rx="6" fill="#c2c9e4"/>
    <rect x="120" y="194" width="150" height="12" rx="6" fill="#c2c9e4"/>
    <line x1="120" y1="228" x2="290" y2="228" stroke="#9aa3c7" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="120" y="248" width="120" height="12" rx="6" fill="#c2c9e4"/>
    <rect x="120" y="272" width="170" height="12" rx="6" fill="#c2c9e4"/>
    <circle cx="205" cy="340" r="32" fill="#34d399"/>
    <path d="M190 340 L201 351 L221 328" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- checklist card -->
    <rect x="380" y="70" width="300" height="200" rx="16" fill="#111833" stroke="#2a3568" stroke-width="2"/>
    <text x="410" y="112" font-size="22" font-weight="700" fill="#ffffff">Checklist</text>
    <g font-size="19" fill="#c2c9e4">
      <circle cx="416" cy="146" r="12" fill="#34d399"/>
      <text x="410" y="152" font-size="15" font-weight="800" fill="#04261b">✓</text>
      <text x="440" y="153">Receipt saved</text>
      <circle cx="416" cy="186" r="12" fill="#34d399"/>
      <text x="410" y="192" font-size="15" font-weight="800" fill="#04261b">✓</text>
      <text x="440" y="193">Balance checked</text>
      <circle cx="416" cy="226" r="12" fill="none" stroke="#22d3ee" stroke-width="3"/>
      <text x="440" y="233">Support ticket</text>
    </g>
    <!-- support bubble -->
    <rect x="380" y="300" width="300" height="150" rx="16" fill="#182147" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="430" cy="350" r="26" fill="#22d3ee"/>
    <text x="430" y="360" font-size="30" font-weight="800" fill="#04202a" text-anchor="middle">?</text>
    <rect x="472" y="330" width="180" height="14" rx="7" fill="#2a3568"/>
    <rect x="472" y="354" width="140" height="14" rx="7" fill="#202a55"/>
    <rect x="404" y="396" width="252" height="30" rx="10" fill="#0ea5c4"/>
    <text x="530" y="418" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Contact official help</text>
  </g>
</svg>
